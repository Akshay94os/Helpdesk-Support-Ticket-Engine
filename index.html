<!DOCTYPE html>
<html>
<head><title>Helpdesk Hub</title><style>body{font-family:sans-serif;padding:2rem;background:#0f172a;color:#fff;}input,select,textarea{width:100%;margin-bottom:8px;padding:8px;background:#1e293b;border:1px solid #334155;color:#fff;}button{background:#0284c7;color:#fff;padding:8px 16px;border:none;cursor:pointer;}table{width:100%;border-collapse:collapse;margin-top:1.5rem;}th,td{padding:8px;border:1px solid #334155;}</style></head>
<body>
  <h1>Support Tickets</h1>
  <form method="POST">
    {% csrf_token %}
    <input name="title" placeholder="Issue Title" required>
    <input name="email" type="email" placeholder="Contact Email" required>
    <select name="priority"><option value="LOW">Low</option><option value="MED">Medium</option><option value="HIGH">High</option></select>
    <textarea name="description" placeholder="Describe the error/problem..."></textarea>
    <button type="submit">Submit Ticket</button>
  </form>
  <table>
    <tr><th>ID</th><th>Title</th><th>Priority</th><th>Status</th><th>Action</th></tr>
    {% for t in tickets %}
    <tr><td>#{{ t.id }}</td><td>{{ t.title }}</td><td>{{ t.priority }}</td><td>{{ t.status }}</td><td><a href="/toggle/{{ t.id }}/" style="color:#38bdf8;">Toggle</a></td></tr>
    {% endfor %}
  </table>
</body>
</html>
